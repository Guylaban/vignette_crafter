# =============================================================================
# SIMULATION CONFIG
# =============================================================================

simulation:

  # ── Personas ────────────────────────────────────────────────────────────────
  num_personas: 500
  persona_ids:  []      # e.g. [1, 2, 3] — overrides num_personas if non-empty
  seed:         42

  # ── Pipeline ─────────────────────────────────────────────────────────────────
  # craft_persona         → generate & validate personas only (Step 1)
  # vignette_from_persona → load saved personas, generate & validate vignettes (Step 2)
  # vignette_full         → craft persona + generate & validate vignette in one run
  # vignette_no_val       → generate vignette only, no validation
  # zero_shot             → generate vignette with no persona context
  pipeline: vignette_from_persona
  persona_source: data/output/full/gpt-5.4   # required for vignette_from_persona

  # ── Vignette context (used when pipeline includes vignette generation) ───────
  # full           → demographics + self-report + cognitive edges
  # no_formulation → demographics + self-report only
  # zero_shot      → no context
  vignette_mode: full

  # ── Sampling ─────────────────────────────────────────────────────────────────
  node_prob:         0.7   # P(node active)
  edge_prob:         0.7   # P(edge active | both nodes active)
  self_report_items: 3     # items sampled per active node

  # ── Validation ───────────────────────────────────────────────────────────────
  max_retries:  5
  temperature:  0.7


# =============================================================================
# MODELS
# =============================================================================


models:
  persona_validator: qwen3.6-35b
  persona_crafter:   qwen3.6-35b
  vignette_crafter:  qwen3.6-35b
  vignette_validator: qwen3.6-35b

# ── Available models ──────────────────────────────────────────────────────────
# OpenAI        gpt-5.4-mini | gpt-5.4 | gpt-4o mini
# Anthropic     claude-sonnet-4-6 | claude-haiku-4-5
# Gemini        gemini-2.5-pro | gemini-2.5-flash | 
# DeepSeek      deepseek-chat | deepseek-reasoner
# Lab/Tailscale llama3.1-70b | qwen2.5-32b | qwen2.5-72b | qwen3.6-35b | qwen3.6-35b-ablit | gpt-oss-20b | gemma4-31b | nemotron-70b
